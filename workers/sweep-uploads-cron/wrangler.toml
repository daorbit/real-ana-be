# Pings the forms service's upload-sweep route every minute.
#
# A respondent who picks a file and then abandons the form leaves an asset in
# Cloudinary that nothing will ever reference. The route deletes those once they
# are past their grace period (UPLOAD_GRACE_MINUTES, default 5), which only
# works if something calls it at that granularity — Vercel's Hobby plan caps
# cron at one run per day, so this Worker is the scheduler.
#
# Nothing server-side changes: the route authenticates on CRON_SECRET and does
# not care who calls it.
name = "sweep-uploads-cron"
main = "src/index.ts"
compatibility_date = "2026-08-19"
account_id = "594bc4ae163c865c9faa90cbb457d30b"

# Cron-only Worker: no fetch handler, so no HTTP route is served and the
# workers.dev subdomain is never hit.
workers_dev = false

[triggers]
# Every minute, so an abandoned upload survives 5-6 minutes at worst. The grace
# period is the knob for that ceiling, not this interval -- the route sweeps
# what is past its grace rather than what this tick missed.
crons = ["* * * * *"]

[vars]
# The forms backend, which is a separate deployment to the analytics API the
# sibling Workers here call. Not a secret: CRON_SECRET is the credential, and it
# is set via `wrangler secret put`, never in this file.
FORMS_API_BASE = "https://forms.daorbit.in"

[observability]
# Keeps logs queryable in the dashboard rather than only live via `wrangler tail`.
enabled = true
