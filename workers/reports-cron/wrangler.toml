# Pings the reports cron route twice a day.
#
# Vercel's Hobby plan caps cron at one run per day with per-hour precision
# (±59 min of jitter). The report runner advances each schedule to
# `now + interval` when it sends, so a tick that lands a few minutes later than
# the previous one pushes `nextRunAt` past the following day's single tick — the
# schedule then falls out of the due window and silently skips a day, and keeps
# skipping. That is what stalled the "Daily" report for a week with no
# `lastError` to show for it.
#
# Two ticks a day gives every daily schedule a second chance inside the same
# calendar day, so the drift cannot outrun the trigger. The runner asks what is
# due rather than what is scheduled for now, so a spare tick is a no-op — and
# `MIN_INTERVAL_MS` in the runner is what actually prevents a double send, not
# the trigger interval.
#
# Nothing server-side changes: the route authenticates on CRON_SECRET and does
# not care who calls it. The daily entry in vercel.json stays as the safety net.
name = "reports-cron"
main = "src/index.ts"
compatibility_date = "2026-08-19"
account_id = "594bc4ae163c865c9faa90cbb457d30b"

# Cron-only Worker: no fetch handler, so no HTTP route is served and the
# workers.dev subdomain is never hit.
workers_dev = false

[triggers]
# 06:00 and 18:00 UTC. Deliberately offset from the 08:00 UTC entry in
# vercel.json so the two schedulers do not contend for the same cold start.
crons = ["0 6,18 * * *"]

[vars]
# Public base URL of the backend deployment -- the custom domain in front of
# Vercel, matching PUBLIC_BASE_URL in .env. Not a secret: CRON_SECRET is the
# credential, and it is set via `wrangler secret put`, never in this file.
API_BASE = "https://quantalog-be.daorbit.in"

[observability]
# Keeps logs queryable in the dashboard rather than only live via `wrangler tail`.
enabled = true
