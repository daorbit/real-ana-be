
name: social-posts cron

on:
  schedule:
    - cron: "*/25 * * * *"
  # Lets a person run it now from the Actions tab when catching up a missed window.
  workflow_dispatch:

concurrency:
  group: social-posts-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish due posts
        env:
          API_BASE: ${{ secrets.API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "API_BASE and CRON_SECRET repository secrets must both be set." >&2
            exit 1
          fi

          # --fail-with-body so a non-2xx still prints what the API said before
          # the step fails; the route returns its error in the JSON body.
          # Retries cover a cold start timing out rather than a real fault.
          curl --silent --show-error --fail-with-body \
               --retry 3 --retry-delay 10 --retry-connrefused \
               --max-time 120 \
               -H "Authorization: Bearer ${CRON_SECRET}" \
               "${API_BASE}/api/cron/social-posts"
